[package]
name = "keystore-forge"
version = "0.1.0"
description = "Local keystore creation and signing utility"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "keystore_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
keyring = "3.6.3"
thiserror = "2"
tauri = { version = "2.3.0", features = [] }
tauri-plugin-shell = "2.3.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-fs = "2.3.0"
dirs = "6.0.0"
glob = "0.3.0"

[dev-dependencies]
tempfile = "3.10.0"
